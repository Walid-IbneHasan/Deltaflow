name: deltaflow

services:
  postgres:
    # Postgres 15 through 18 are supported, and CI runs the suite on each
    # (DELTAFLOW_PG_VERSION). Postgres 18's image keeps its data under
    # /var/lib/postgresql: set DELTAFLOW_PG_DATA_MOUNT=/var/lib/postgresql,
    # and give each version its own volume with another project name
    # (docker compose -p deltaflow-pg18 ...). From Git Bash on Windows, also set
    # MSYS_NO_PATHCONV=1, or the path is rewritten into a Windows one.
    image: postgres:${DELTAFLOW_PG_VERSION:-16}
    environment:
      POSTGRES_USER: deltaflow
      POSTGRES_PASSWORD: deltaflow
      POSTGRES_DB: deltaflow
    command:
      - postgres
      - -c
      - wal_level=logical
      - -c
      - max_replication_slots=16
      - -c
      - max_wal_senders=16
      # TLS, with the certificate the image ships for "localhost". Clients
      # default to sslmode=prefer, so every harness connection, replication
      # included, is encrypted (tests/integration/test_tls.py). The key is
      # the same in every copy of the image: for the harness only.
      - -c
      - ssl=on
      - -c
      - ssl_cert_file=/etc/ssl/certs/ssl-cert-snakeoil.pem
      - -c
      - ssl_key_file=/etc/ssl/private/ssl-cert-snakeoil.key
      # wal_sender_timeout is left at its default (60s) and not set here:
      # command-line settings override ALTER SYSTEM, and the backpressure
      # test lowers it with ALTER SYSTEM.
    ports:
      - "${DELTAFLOW_PG_PORT:-55432}:5432"
    volumes:
      - pgdata:${DELTAFLOW_PG_DATA_MOUNT:-/var/lib/postgresql/data}
      - ./docker/initdb:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U deltaflow -d deltaflow_test"]
      interval: 1s
      timeout: 3s
      retries: 30

volumes:
  pgdata:
