apiVersion: v1
kind: Service
metadata:
  name: {{ include "deltaflow.fullname" . }}-headless
  labels:
    {{- include "deltaflow.labels" . | nindent 4 }}
spec:
  clusterIP: None
  selector:
    {{- include "deltaflow.selectorLabels" . | nindent 4 }}
  ports:
    - name: metrics
      port: {{ .Values.metrics.port }}
      targetPort: metrics
---
apiVersion: v1
kind: Service
metadata:
