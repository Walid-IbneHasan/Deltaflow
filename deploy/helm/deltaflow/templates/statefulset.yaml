{{- if not .Values.database.existingSecret }}
{{- fail "database.existingSecret is required: a Secret holding the connection string" }}
{{- end }}
{{- if not (has .Values.mode (list "run" "cluster")) }}
{{- fail "mode must be run or cluster" }}
{{- end }}
{{- $cluster := eq .Values.mode "cluster" }}
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: {{ include "deltaflow.fullname" . }}
  labels:
    {{- include "deltaflow.labels" . | nindent 4 }}
spec:
  serviceName: {{ include "deltaflow.fullname" . }}-headless
  replicas: {{ if $cluster }}{{ .Values.replicas }}{{ else }}1{{ end }}
  # Workers take shards by leases; none needs another to be ready first.
  podManagementPolicy: Parallel
  selector:
    matchLabels:
      {{- include "deltaflow.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "deltaflow.selectorLabels" . | nindent 8 }}
      annotations:
        checksum/views: {{ .Values.views.sql | sha256sum }}
        {{- with .Values.podAnnotations }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
    spec:
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      terminationGracePeriodSeconds: {{ .Values.terminationGracePeriodSeconds }}
      containers:
        - name: deltaflow
          image: {{ include "deltaflow.image" . }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          securityContext:
            {{- toYaml .Values.securityContext | nindent 12 }}
          args:
            {{- if $cluster }}
            - cluster
            - /etc/deltaflow/views.sql
            - --worker-id
            - $(POD_NAME)
            - --slot-prefix
            - {{ .Values.slot | quote }}
            - --state-root
            - /var/lib/deltaflow/state
            - --shards
            - {{ .Values.cluster.shards | quote }}
            {{- range .Values.cluster.shardBy }}
            - --shard-by
            - {{ . | quote }}
            {{- end }}
            - --heartbeat
            - {{ .Values.cluster.heartbeatSeconds | quote }}
            - --ttl
            - {{ .Values.cluster.ttlSeconds | quote }}
            {{- else }}
            - run
            - /etc/deltaflow/views.sql
            - --slot
            - {{ .Values.slot | quote }}
            - --state-dir
            - /var/lib/deltaflow/state
            {{- end }}
            {{- with .Values.publication }}
            - --publication
            - {{ . | quote }}
            {{- end }}
            - --http-host
            - 0.0.0.0
            - --http-port
            - {{ .Values.metrics.port | quote }}
            - --memory-budget
            - {{ .Values.memoryBudgetMiB | quote }}
            - --flush-interval
            - {{ .Values.flushIntervalSeconds | quote }}
            - --checkpoint-interval
            - {{ .Values.checkpointIntervalSeconds | quote }}
            - --snapshot
            - {{ .Values.snapshot.mode | quote }}
            - --snapshot-chunk-rows
            - {{ .Values.snapshot.chunkRows | quote }}
            - --max-transaction-changes
            - {{ .Values.maxTransactionChanges | quote }}
            - --sink-spill-after
            - {{ .Values.sinkSpillAfter | quote }}
            - --log-format
            - {{ .Values.logFormat | quote }}
            {{- range .Values.extraArgs }}
            - {{ . | quote }}
            {{- end }}
          env:
            - name: DELTAFLOW_DSN
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.database.existingSecret }}
                  key: {{ .Values.database.secretKey }}
            - name: POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            {{- with .Values.env }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
          ports:
            - name: metrics
              containerPort: {{ .Values.metrics.port }}
          livenessProbe:
            httpGet:
              path: /healthz
              port: metrics
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 6
          readinessProbe:
            httpGet:
              # /readyz: the views are live (a worker answers it; a
              # cluster worker is ready once it runs)
              path: {{ if $cluster }}/healthz{{ else }}/readyz{{ end }}
              port: metrics
            periodSeconds: 5
            timeoutSeconds: 3
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          volumeMounts:
            - name: state
              mountPath: /var/lib/deltaflow
            - name: views
              mountPath: /etc/deltaflow
              readOnly: true
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: views
          configMap:
            name: {{ include "deltaflow.viewsConfigMap" . }}
        - name: tmp
          emptyDir: {}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
  volumeClaimTemplates:
    - metadata:
        name: state
      spec:
        accessModes:
          {{- toYaml .Values.persistence.accessModes | nindent 10 }}
        {{- with .Values.persistence.storageClass }}
        storageClassName: {{ . }}
        {{- end }}
        resources:
          requests:
            storage: {{ .Values.persistence.size }}
