name: release

# Pushing a tag such as v0.1.0 publishes that version: the package to PyPI
# (as deltaflow-pg), the image and the Helm chart to ghcr.io, and a GitHub
# release with the CHANGELOG.md section. Run by hand (Actions → release →
# Run workflow), it publishes the package to TestPyPI only, as a rehearsal.
#
# PyPI and TestPyPI accept the uploads through trusted publishing: each
# names this repository, this file and the environment, so no token is
# stored anywhere.

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions: {}

concurrency:
  group: release-${{ github.ref }}

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: astral-sh/setup-uv@v10.2.0
      - name: Versions agree
        id: version
        run: |
          version=$(sed -n 's/^__version__ = "\(.*\)"$/\1/p' deltaflow/__init__.py)
          chart=$(sed -n 's/^version: //p' deploy/helm/deltaflow/Chart.yaml)
          app=$(sed -n 's/^appVersion: "\(.*\)"$/\1/p' deploy/helm/deltaflow/Chart.yaml)
          echo "package $version, chart $chart, chart appVersion $app"
          if [ "$chart" != "$version" ] || [ "$app" != "$version" ]; then
            echo "::error::Chart.yaml's version and appVersion must be $version"; exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
      - name: The tag, the changelog and CI agree
        if: github.event_name == 'push'
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          if [ "$GITHUB_REF_NAME" != "v$VERSION" ]; then
            echo "::error::tag $GITHUB_REF_NAME, but the package is $VERSION"; exit 1
          fi
          if ! grep -q "^## $VERSION " CHANGELOG.md; then
            echo "::error::CHANGELOG.md has no section for $VERSION"; exit 1
          fi
          ci=$(gh run list --repo "$GITHUB_REPOSITORY" --workflow ci.yml --commit "$GITHUB_SHA" \
            --limit 1 --json conclusion -q '.[0].conclusion')
          if [ "$ci" != "success" ]; then
            echo "::error::CI has not passed for this commit (${ci:-no run}); tag a commit whose CI is green"; exit 1
          fi
      - run: uv build
      - run: uvx twine check --strict dist/*
      - uses: actions/upload-artifact@v7.0.2
        with:
          name: dist
          path: dist/

  testpypi:
    if: github.event_name == 'workflow_dispatch'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: testpypi
      url: https://test.pypi.org/project/deltaflow-pg/
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v8.0.2
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@v1.14.3
        with:
          repository-url: https://test.pypi.org/legacy/
          # A rehearsal may be run again; TestPyPI keeps the first upload.
          skip-existing: true

  pypi:
    if: github.event_name == 'push'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/project/deltaflow-pg/
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v8.0.2
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@v1.14.3

  image:
    if: github.event_name == 'push'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7.0.1
      # Every dependency ships Linux wheels for both, so arm64 needs no compiler.
      - uses: docker/setup-qemu-action@v4.4.0
      - uses: docker/setup-buildx-action@v4.4.1
      - uses: docker/login-action@v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - id: meta
        uses: docker/metadata-action@v6.2.0
        with:
          images: ghcr.io/walid-ibnehasan/deltaflow
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
      - uses: docker/build-push-action@v7.4.0
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

  chart:
    if: github.event_name == 'push'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: azure/setup-helm@v4.3.0
      - run: helm package deploy/helm/deltaflow --destination out
      - env:
          TOKEN: ${{ github.token }}
          VERSION: ${{ needs.build.outputs.version }}
        run: |
          echo "$TOKEN" | helm registry login ghcr.io --username "$GITHUB_ACTOR" --password-stdin
          helm push "out/deltaflow-$VERSION.tgz" oci://ghcr.io/walid-ibnehasan/charts

  github-release:
    needs: [build, pypi, image, chart]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/download-artifact@v8.0.2
        with:
          name: dist
          path: dist/
      - env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.build.outputs.version }}
        run: |
          # This version's CHANGELOG.md section, with its links made absolute.
          base="https://github.com/$GITHUB_REPOSITORY/blob/$GITHUB_REF_NAME/"
          awk -v v="$VERSION" '/^## /{ if (p) exit; p = index($0, "## " v " ") == 1; next } p' CHANGELOG.md \
            | sed -E "s#\]\(([A-Za-z][^):]*)\)#](${base}\1)#g" > notes.md
          {
            echo
            echo "## Install"
            echo
            echo '```sh'
            echo "pip install deltaflow-pg==$VERSION"
            echo "docker pull ghcr.io/walid-ibnehasan/deltaflow:$VERSION"
            echo "helm install <name> oci://ghcr.io/walid-ibnehasan/charts/deltaflow --version $VERSION"
            echo '```'
          } >> notes.md
          gh release create "$GITHUB_REF_NAME" dist/* --verify-tag \
            --title "Deltaflow $VERSION" --notes-file notes.md
