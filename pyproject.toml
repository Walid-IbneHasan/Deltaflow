[project]
name = "deltaflow"
version = "0.0.0"
description = "Incremental view maintenance over PostgreSQL logical replication"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "psycopg[binary]>=3.2",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "ruff>=0.8",
    "mypy>=1.13",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["deltaflow"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "UP", "SIM", "RUF", "ASYNC", "PT", "C4", "PL"]
ignore = [
    "PLR2004", # magic values are fine in tests and protocol code
    "PLR0913", # CLI entry points take many options
    "ASYNC109", # connect/close timeouts are part of the API, not a smell
]

[tool.mypy]
strict = true
python_version = "3.12"
files = ["deltaflow", "tests"]
warn_unreachable = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = ["-ra", "--strict-markers"]
markers = [
    "integration: needs the docker compose Postgres (make up)",
]
