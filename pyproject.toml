[project]
name = "deltaflow-pg"
dynamic = ["version", "readme"]
description = "Incremental view maintenance over PostgreSQL logical replication"
requires-python = ">=3.12"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
authors = [{ name = "Walid Ibne Hasan", email = "walid.ibne.hasan@gmail.com" }]
keywords = ["postgresql", "cdc", "logical-replication", "materialized-views", "streaming", "ivm"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Intended Audience :: System Administrators",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Database",
    "Typing :: Typed",
]
dependencies = [
    "pglast>=8.7",
    "psycopg[binary]>=3.2",
    "rocksdict>=0.3.29",
]

[project.urls]
Homepage = "https://github.com/Walid-IbneHasan/Deltaflow"
Source = "https://github.com/Walid-IbneHasan/Deltaflow"
Documentation = "https://github.com/Walid-IbneHasan/Deltaflow/tree/main/docs"
Issues = "https://github.com/Walid-IbneHasan/Deltaflow/issues"
Changelog = "https://github.com/Walid-IbneHasan/Deltaflow/blob/main/CHANGELOG.md"

[project.scripts]
deltaflow = "deltaflow.cli:main"

[dependency-groups]
dev = [
    "pytest>=8.3",
    "ruff>=0.8",
    "mypy>=1.13",
    "hypothesis>=6.100",
]

[build-system]
requires = ["hatchling>=1.27", "hatch-fancy-pypi-readme>=24.1"]
build-backend = "hatchling.build"

[tool.hatch.version]
path = "deltaflow/__init__.py"

# PyPI shows the README; links into the repository become absolute there.
[tool.hatch.metadata.hooks.fancy-pypi-readme]
content-type = "text/markdown"

[[tool.hatch.metadata.hooks.fancy-pypi-readme.fragments]]
path = "README.md"

[[tool.hatch.metadata.hooks.fancy-pypi-readme.substitutions]]
pattern = '\]\((?!https?://|#)([^)]+)\)'
replacement = '](https://github.com/Walid-IbneHasan/Deltaflow/blob/main/\1)'

[tool.hatch.build.targets.wheel]
packages = ["deltaflow"]

[tool.hatch.build.targets.sdist]
include = ["/deltaflow", "/docs", "/README.md", "/CHANGELOG.md", "/LICENSE", "/NOTICE", "/pyproject.toml"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "UP", "SIM", "RUF", "ASYNC", "PT", "C4", "PL"]
ignore = [
    "PLR2004", # magic values are fine in tests and protocol code
    "PLR0913", # CLI entry points take many options
    "ASYNC109", # connect/close timeouts are part of the API, not a smell
]
# Math notation in the join/algebra docstrings.
allowed-confusables = ["×", "−"]

[tool.mypy]
strict = true
python_version = "3.12"
files = ["deltaflow", "tests"]
warn_unreachable = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = ["-ra", "--strict-markers"]
markers = [
    "integration: needs the docker compose Postgres (make up)",
]
